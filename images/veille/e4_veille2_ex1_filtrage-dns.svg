<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'IBM Plex Sans', Arial, sans-serif">
  <title>Le trajet d'une requête DNS à travers AdGuard Home</title>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1b3a5c"/></marker>
  <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8772e"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <rect x="20" y="100" width="160" height="100" rx="4" fill="#ffffff" stroke="#1b3a5c" stroke-width="2"/>
  <text x="100" y="140" font-size="15" font-weight="700" text-anchor="middle" fill="#1b3a5c">Appareils</text>
  <text x="100" y="162" font-size="13" text-anchor="middle" fill="#4a6380">PC, téléphone, TV…</text>
  <path d="M180 150 L255 150" stroke="#1b3a5c" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="218" y="140" font-size="11" text-anchor="middle" fill="#4a6380">requête</text>
  <rect x="260" y="80" width="220" height="140" rx="4" fill="#1b3a5c"/>
  <text x="370" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">AdGuard Home</text>
  <text x="370" y="152" font-size="13" text-anchor="middle" fill="#c9d5e2">sur le Raspberry Pi</text>
  <text x="370" y="186" font-size="12" text-anchor="middle" fill="#ffffff">compare aux listes de blocage</text>
  <path d="M480 120 L570 75" stroke="#e8772e" stroke-width="2.5" fill="none" marker-end="url(#fo)"/>
  <path d="M480 180 L570 225" stroke="#1b3a5c" stroke-width="2.5" fill="none" marker-end="url(#f)"/>
  <rect x="575" y="40" width="305" height="70" rx="4" fill="#fbe3d3" stroke="#e8772e" stroke-width="2"/>
  <text x="590" y="68" font-size="15" font-weight="700" fill="#b4500f">Domaine bloqué</text>
  <text x="590" y="90" font-size="13" fill="#1b3a5c">publicité, traceur : réponse vide renvoyée</text>
  <rect x="575" y="190" width="305" height="70" rx="4" fill="#eef1f4" stroke="#1b3a5c" stroke-width="2"/>
  <text x="590" y="218" font-size="15" font-weight="700" fill="#1b3a5c">Domaine autorisé</text>
  <text x="590" y="240" font-size="13" fill="#1b3a5c">transmis au DNS upstream (Quad9…)</text>
</svg>
