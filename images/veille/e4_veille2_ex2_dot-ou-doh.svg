<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'IBM Plex Sans', Arial, sans-serif">
  <title>DoT sur son port dédié, DoH mélangé au trafic web</title>
  <rect width="900" height="300" fill="#ffffff"/>
  <!-- DoT -->
  <text x="20" y="34" font-size="17" font-weight="700" fill="#1b3a5c">DNS over TLS (DoT)</text>
  <rect x="20" y="52" width="150" height="56" rx="4" fill="#ffffff" stroke="#1b3a5c" stroke-width="2"/>
  <text x="95" y="85" font-size="14" text-anchor="middle" fill="#1b3a5c">Téléphone</text>
  <rect x="170" y="68" width="360" height="24" fill="#fbe3d3" stroke="#e8772e" stroke-width="2"/>
  <text x="350" y="85" font-size="13" text-anchor="middle" fill="#b4500f" font-weight="700">TLS · port 853, réservé au DNS</text>
  <rect x="530" y="52" width="150" height="56" rx="4" fill="#1b3a5c"/>
  <text x="605" y="85" font-size="14" text-anchor="middle" fill="#ffffff">AdGuard Home</text>
  <text x="700" y="72" font-size="12.5" fill="#4a6380">Facile à repérer</text>
  <text x="700" y="90" font-size="12.5" fill="#4a6380">et à contrôler</text>
  <!-- DoH -->
  <text x="20" y="174" font-size="17" font-weight="700" fill="#1b3a5c">DNS over HTTPS (DoH)</text>
  <rect x="20" y="192" width="150" height="56" rx="4" fill="#1b3a5c"/>
  <text x="95" y="225" font-size="14" text-anchor="middle" fill="#ffffff">AdGuard Home</text>
  <rect x="170" y="208" width="360" height="24" fill="#eef1f4" stroke="#1b3a5c" stroke-width="2"/>
  <text x="350" y="225" font-size="13" text-anchor="middle" fill="#1b3a5c" font-weight="700">HTTPS · port 443, comme le web</text>
  <rect x="530" y="192" width="150" height="56" rx="4" fill="#ffffff" stroke="#1b3a5c" stroke-width="2"/>
  <text x="605" y="225" font-size="14" text-anchor="middle" fill="#1b3a5c">Quad9</text>
  <text x="700" y="212" font-size="12.5" fill="#4a6380">Se confond avec le web :</text>
  <text x="700" y="230" font-size="12.5" fill="#4a6380">discret, mais dur à filtrer</text>
  <line x1="20" y1="140" x2="880" y2="140" stroke="#d9e0e8" stroke-width="2"/>
  <text x="450" y="288" font-size="13" text-anchor="middle" fill="#4a6380">Dans les deux cas, la requête est chiffrée : personne ne peut la lire ni la modifier en chemin.</text>
</svg>
